[build]
  command = "cd web && npm install && npm run build"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "18"

# Optional environment variables for hosted Supabase city reads:
# VITE_CITY_DATA_SOURCE=supabase
# VITE_SUPABASE_URL - Your Supabase project URL
# VITE_SUPABASE_ANON_KEY - Your Supabase anonymous key

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
